{{- /*
The token given inline, in a Secret of its own. Only rendered when `token.value` is set; with
`token.existingSecret` the chart makes nothing and only refers to that Secret.
*/ -}}
{{- if .Values.token.value }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "node-agent.tokenSecretName" . }}
  labels:
    {{- include "node-agent.labels" . | nindent 4 }}
  {{- with include "node-agent.annotations" (dict "ctx" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
type: Opaque
data:
  {{ .Values.token.existingSecretKey }}: {{ .Values.token.value | b64enc }}
{{- end }}
