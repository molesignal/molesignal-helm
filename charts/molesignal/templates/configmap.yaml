apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "molesignal.fullname" . }}-config
  labels:
    {{- include "molesignal.labels" (dict "ctx" . "component" "config") | nindent 4 }}
  {{- with include "molesignal.annotations" (dict "ctx" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
data:
  config.toml: |
    {{- include "molesignal.config.toml" . | nindent 4 }}
