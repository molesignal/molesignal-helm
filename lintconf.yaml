# yamllint rules for `ct lint`. It only reads Chart.yaml, values.yaml and the ci/
# values files (templates hold Go template syntax and are checked by helm itself).
extends: default

rules:
  # Doc comments in values.yaml run long on purpose.
  line-length: disable
  document-start: disable
  truthy: disable
  comments:
    min-spaces-from-content: 1
  comments-indentation: disable
  indentation:
    spaces: 2
    indent-sequences: consistent
  braces:
    min-spaces-inside: 0
    max-spaces-inside: 1
  brackets:
    min-spaces-inside: 0
    max-spaces-inside: 1
  empty-lines:
    max: 2
