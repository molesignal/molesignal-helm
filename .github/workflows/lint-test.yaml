# Checks every change to the chart.
#
#   static   no cluster: helm lint, the generated-docs check, the render tests, the
#            mutation tests, and a schema validation of the rendered manifests
#   install  a real install on a throw-away kind cluster, for each values file in
#            charts/molesignal/ci, followed by `helm test`. Runs when the chart changed.
name: Lint and test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      install_all:
        description: Install every chart on kind even if nothing changed
        type: boolean
        default: false

concurrency:
  group: lint-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HELM_VERSION: v3.17.3
  YQ_VERSION: v4.52.5
  KUBECONFORM_VERSION: v0.8.0
  CT_VERSION: v3.15.0

jobs:
  static:
    name: Lint, render tests, schema validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install yq and kubeconform
        run: |
          sudo curl -fsSL -o /usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          sudo chmod +x /usr/local/bin/yq
          curl -fsSL \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kubeconform

      - name: helm lint (defaults, ci/ and examples/)
        run: make lint

      - name: Values table in the chart README is up to date
        run: make docs-check

      - name: Render tests
        run: make test

      - name: Mutation tests (the tests must notice a broken chart)
        run: make mutate

      - name: Validate rendered manifests against the Kubernetes schemas
        run: |
          set -euo pipefail
          for k8s in 1.25.0 1.30.0; do
            for values in "" charts/molesignal/ci/*.yaml examples/*.yaml; do
              echo "==> Kubernetes ${k8s}, values: ${values:-defaults}"
              helm template check charts/molesignal --namespace check \
                --kube-version "${k8s}" ${values:+--values "${values}"} \
                | kubeconform -strict -summary -kubernetes-version "${k8s}"
            done
          done

  install:
    name: Install on kind
    needs: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: helm/chart-testing-action@v2.9.0
        with:
          version: ${{ env.CT_VERSION }}

      - name: Find out whether the chart changed
        id: changed
        run: |
          if [[ "${{ inputs.install_all }}" == "true" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [[ -n "$(ct list-changed --config ct.yaml)" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: ct lint
        if: steps.changed.outputs.run == 'true'
        run: ct lint --config ct.yaml --all

      - uses: helm/kind-action@v1.15.1
        if: steps.changed.outputs.run == 'true'

      - name: ct install (one install per values file in ci/, then helm test)
        if: steps.changed.outputs.run == 'true'
        run: ct install --config ct.yaml --all

      - name: What is running, when the install failed
        if: failure()
        run: |
          kubectl get pods --all-namespaces -o wide || true
          kubectl get events --all-namespaces --sort-by=.lastTimestamp | tail -40 || true
