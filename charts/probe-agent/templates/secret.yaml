{{- /*
The token given inline, in a Secret of its own. Only rendered when `registration.token`
is set. An Agent reads it once, before it has an identity, so the Secret is not kept
when the release is uninstalled and a new token does not restart anything.
*/ -}}
{{- if .Values.registration.token }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "probe-agent.tokenSecretName" . }}
  labels:
    {{- include "probe-agent.labels" . | nindent 4 }}
  {{- with include "probe-agent.annotations" (dict "ctx" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
type: Opaque
data:
  {{ .Values.registration.existingSecretKey }}: {{ .Values.registration.token | b64enc }}
{{- end }}
