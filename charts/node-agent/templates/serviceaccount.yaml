{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "node-agent.serviceAccountName" . }}
  labels:
    {{- include "node-agent.labels" . | nindent 4 }}
  {{- with include "node-agent.annotations" (dict "ctx" . "extra" .Values.serviceAccount.annotations) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}
