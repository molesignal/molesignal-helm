apiVersion: v1
entries:
  molesignal:
  - annotations:
      artifacthub.io/category: monitoring-logging
      artifacthub.io/changes: |
        - kind: fixed
          description: Standalone pods, the default, never became ready because the readiness probe asked a path that needs a login
        - kind: fixed
          description: The bucket sidecar pulls the AWS CLI from Docker Hub, because the anonymous limit of ECR Public could hold up an install
        - kind: changed
          description: releaseChannel defaults to stable, the channel of the default image
        - kind: fixed
          description: Examples and documentation no longer name settings the application has removed or renamed
        - kind: added
          description: README and install notes explain client addresses behind an ingress
      artifacthub.io/containsSecurityUpdates: "false"
      artifacthub.io/images: |
        - name: molesignal
          image: ghcr.io/molesignal/molesignal:latest
          platforms:
            - linux/amd64
            - linux/arm64
        - name: postgresql
          image: postgres:17
        - name: rustfs
          image: rustfs/rustfs:latest
        - name: aws-cli
          image: amazon/aws-cli:latest
      artifacthub.io/license: Apache-2.0
      artifacthub.io/links: |
        - name: Documentation
          url: https://github.com/molesignal/molesignal-helm/tree/main/docs
        - name: Application
          url: https://github.com/molesignal/molesignal
      artifacthub.io/prerelease: "true"
