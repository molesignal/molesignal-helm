{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "molesignal.serviceAccountName" . }}
  labels:
    {{- include "molesignal.labels" (dict "ctx" . "component" "app") | nindent 4 }}
  {{- with include "molesignal.annotations" (dict "ctx" . "extra" .Values.serviceAccount.annotations) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}
