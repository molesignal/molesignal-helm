{{- /*
One Deployment per active role. No role keeps data on a volume of its own: the
application acknowledges a write only once its write-ahead log object is in the object
store, and a lost intake pod's log is taken over by the others. The pod template is
shared; see molesignal.podTemplate.
*/ -}}
{{- range $role := (include "molesignal.activeRoles" . | fromJsonArray) }}
{{- $roleCfg := index $.Values $role }}
{{- $name := include "molesignal.workloadName" (dict "ctx" $ "role" $role) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "molesignal.labels" (dict "ctx" $ "component" $role) | nindent 4 }}
  {{- with include "molesignal.annotations" (dict "ctx" $) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  {{- if not (and $roleCfg.autoscaling $roleCfg.autoscaling.enabled) }}
  replicas: {{ $roleCfg.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "molesignal.selectorLabels" (dict "ctx" $ "component" $role) | nindent 6 }}
  template:
    {{- include "molesignal.podTemplate" (dict "ctx" $ "role" $role) | nindent 4 }}
{{- end }}
