{{- if .Values.priorityClass.create }}
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: {{ include "node-agent.priorityClassName" . }}
  labels:
    {{- include "node-agent.labels" . | nindent 4 }}
  {{- with include "node-agent.annotations" (dict "ctx" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
value: {{ .Values.priorityClass.value | int64 }}
preemptionPolicy: {{ .Values.priorityClass.preemptionPolicy }}
globalDefault: false
description: Node agent of MoleSignal (release {{ .Release.Name }} in {{ .Release.Namespace }}).
{{- end }}
