{{- /*
Core secrets: the field-level encryption root key, the node-to-node token and the
optional JWT override. Values that are not supplied are generated on first install
and then read back from the cluster on every upgrade, so they never change by
accident. The Secret is kept when the release is uninstalled, because the cipher
key must outlive the release for as long as the data does.
*/ -}}
{{- if not .Values.secrets.existingSecret }}
{{- $name := include "molesignal.secretName" . }}
{{- $keys := .Values.secrets.keys }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "molesignal.labels" (dict "ctx" . "component" "secret") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    {{- with include "molesignal.annotations" (dict "ctx" .) }}
    {{- . | nindent 4 }}
    {{- end }}
type: Opaque
data:
  {{ $keys.cipherKey }}: {{ include "molesignal.secretData" (dict "ctx" . "name" $name "key" $keys.cipherKey "value" .Values.secrets.cipherKey "generate" (randBytes 32)) }}
  {{ $keys.clusterToken }}: {{ include "molesignal.secretData" (dict "ctx" . "name" $name "key" $keys.clusterToken "value" .Values.secrets.clusterToken "generate" (randAlphaNum 48)) }}
  {{- if .Values.secrets.jwtSecretOverride }}
  {{ $keys.jwtSecretOverride }}: {{ .Values.secrets.jwtSecretOverride | b64enc }}
  {{- end }}
{{- end }}

{{- /*
Inline credentials of an external database or object store. Only rendered when
the connection string or the key pair is given in the values.
*/ -}}
{{- $inlineDsn := and (not .Values.postgresql.enabled) (not .Values.externalDatabase.existingSecret) .Values.externalDatabase.dsn }}
{{- $inlineKeys := and (not .Values.rustfs.enabled) (not .Values.objectStore.existingSecret) .Values.objectStore.accessKey .Values.objectStore.secretKey }}
{{- if or $inlineDsn $inlineKeys }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "molesignal.externalSecretName" . }}
  labels:
    {{- include "molesignal.labels" (dict "ctx" . "component" "secret") | nindent 4 }}
  {{- with include "molesignal.annotations" (dict "ctx" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
type: Opaque
data:
  {{- if $inlineDsn }}
  database-dsn: {{ .Values.externalDatabase.dsn | b64enc }}
  {{- end }}
  {{- if $inlineKeys }}
  object-store-access-key: {{ .Values.objectStore.accessKey | b64enc }}
  object-store-secret-key: {{ .Values.objectStore.secretKey | b64enc }}
  {{- end }}
{{- end }}
